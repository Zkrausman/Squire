name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clean-install-build-test:
    name: clean-install-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .github/runtime/package-lock.json

      - name: Validate CI workflow contract
        run: node .github/validate-ci-workflow.mjs

      - name: Run CI workflow negative probes
        run: node .github/test-ci-workflow-validator.mjs

      - name: Install dependencies
        run: npm ci

      - name: Provision ticket runtime
        run: |
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /ticket /ticket/runtime /ticket/workspace
          install -m 600 .github/runtime/package.json /ticket/runtime/package.json
          install -m 600 .github/runtime/package-lock.json /ticket/runtime/package-lock.json
          npm ci --prefix /ticket/runtime --ignore-scripts --no-audit --no-fund

      - name: Validate ticket runtime
        run: node .github/validate-ticket-runtime.mjs

      - name: Build
        run: npm run build

      - name: Validate contracts
        run: npm run validate:contracts

      - name: Run tests
        timeout-minutes: 5
        run: npm test

      - name: Verify clean tree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  filesystem-event-integration:
    name: filesystem-event-integration
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run filesystem event integration
        timeout-minutes: 5
        run: node --test dist/test/personal-run-events.test.js

  windows-launch-capture:
    name: windows-launch-capture
    strategy:
      fail-fast: false
      matrix:
        node:
          - "20.17.0"
          - "22.9.0"
          - "24"
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Build
        run: npm run build

      - name: Run Windows launch capture regression
        timeout-minutes: 5
        run: node --test --test-timeout=120000 dist/test/personal-windows-state-replace.test.js dist/test/personal-windows-launch.test.js dist/test/personal-launch-material.test.js dist/test/personal-background-status.test.js dist/test/personal-owner-observation.test.js dist/test/personal-controller.test.js dist/test/personal-plan-supervisor.test.js dist/test/personal-report-correction.test.js dist/test/personal-report-bytes.test.js dist/test/personal-windows-report-evidence.test.js dist/test/personal-windows-report-correction.test.js dist/test/personal-phase-transport.test.js
