name: Desktop codegen source acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  desktop-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test --test-isolation=none test/desktop-codegen.test.mjs
