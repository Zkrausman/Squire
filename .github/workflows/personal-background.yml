name: Personal background CLI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  background-launch-status:
    name: background-launch-status (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run background and status tests
        run: node --test dist/test/personal-background-status.test.js
